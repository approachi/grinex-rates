services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grinex_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator-test:
    image: kukymbr/goose-docker:latest
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres-test port=5432 user=postgres password=postgres dbname=grinex_test sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: on-failure
